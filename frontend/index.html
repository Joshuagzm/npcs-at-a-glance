<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPCs at a Glance</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong colour scheme. Keep in sync with ThemeProvider's storageKey.
      ;(function () {
        try {
          var stored = localStorage.getItem('npc-management-theme')
          var theme = stored || 'system'
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
