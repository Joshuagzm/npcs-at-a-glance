<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- open parchment sheet -->
  <rect x="16" y="11" width="32" height="42" fill="#d9b274" />
  <!-- soft shading along the curling side edges -->
  <rect x="16" y="11" width="5" height="42" fill="#cda45f" opacity="0.55" />
  <rect x="43" y="11" width="5" height="42" fill="#cda45f" opacity="0.55" />
  <!-- side edges of the sheet -->
  <path
    d="M16 16 V48 M48 16 V48"
    stroke="#6d451f"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- lines of writing -->
  <g stroke="#6d451f" stroke-width="2.6" stroke-linecap="round">
    <path d="M23 24 H41" />
    <path d="M23 31 H41" />
    <path d="M23 38 H37" />
  </g>
  <!-- top rolled end -->
  <rect
    x="10"
    y="5"
    width="44"
    height="12"
    rx="6"
    fill="#8a5a2b"
    stroke="#6d451f"
    stroke-width="2.5"
  />
  <circle cx="17" cy="11" r="2.3" fill="#efd9ab" />
  <!-- bottom rolled end -->
  <rect
    x="10"
    y="47"
    width="44"
    height="12"
    rx="6"
    fill="#8a5a2b"
    stroke="#6d451f"
    stroke-width="2.5"
  />
  <circle cx="47" cy="53" r="2.3" fill="#efd9ab" />
</svg>
